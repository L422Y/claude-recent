<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Colors match the Claude desktop app so the panel reads as part of it */
  :root {
    color-scheme: dark;
    --bg: #262624; --ink: #F2F0EA; --dim: #B5B3AB; --faint: #8F8D85;
    --field: #30302E; --hover: #2E2E2B; --here: #383834; --focus: #7AA2F7;
    --wait: #F2555A; --review: #7AA2F7;
    --h0: #E0AE5C; --h1: #74C285; --h2: #7FA8F0; --h3: #C39BEA; --h4: #EC9474; --h5: #5CC2C2;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #FAF9F7; --ink: #1A1918; --dim: #4F4E4A; --faint: #75736C;
      --field: #EFEDE8; --hover: #F1EFEB; --here: #E6E3DD; --focus: #3D6FE0;
      --wait: #D62F35; --review: #3D6FE0;
      --h0: #8A5A0E; --h1: #2D7A3E; --h2: #2F5FC4; --h3: #7A45B0; --h4: #B0482A; --h5: #1F7A7A;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink);
    font: 13px/1.4 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 8px 8px 4px; }
  #q {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid transparent; border-radius: 6px; padding: 5px 8px;
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: var(--focus); }
  .toggles { display: flex; gap: 12px; padding: 6px 2px 0; font-size: 12px; }
  .toggles button { all: unset; cursor: pointer; color: var(--faint); }
  .toggles button[aria-pressed="true"] { color: var(--ink); }
  .toggles button:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

  h2 {
    font-size: 12px; font-weight: 600; color: var(--dim);
    margin: 14px 12px 3px; display: flex; gap: 6px; align-items: baseline;
  }
  h2 .n { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
  h2.waiting { color: var(--wait); }

  a.row {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px;
    margin: 0 4px; padding: 5px 8px 6px 10px; border-radius: 5px;
    color: inherit; text-decoration: none;
  }
  /* The status rail: blocked and ready-for-review get a mark, everything else stays quiet */
  a.row::before {
    content: ''; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 2px; border-radius: 1px;
  }
  a.row.blocked::before { background: var(--wait); }
  a.row.review_ready::before { background: var(--review); }
  a.row:hover { background: var(--hover); }
  a.row.here { background: var(--here); }
  a.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  a.row.archived { opacity: .5; }
  a.row.opening { animation: opened .6s ease-out; }
  @keyframes opened { from { background: color-mix(in srgb, var(--focus) 30%, transparent); } }
  @media (prefers-reduced-motion: reduce) { a.row.opening { animation: none; } }

  .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blocked .title { font-weight: 600; }
  .tree { color: var(--faint); font-weight: 400; }
  .when { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .sub { grid-column: 1 / -1; display: flex; gap: 6px; min-width: 0; font-size: 12px; color: var(--dim); }
  .proj { flex: none; color: var(--p); font-weight: 500; }
  .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blocked .detail { color: var(--ink); }

  .empty { color: var(--faint); padding: 16px 12px; }
</style>
<header>
  <input type="search" id="q" placeholder="Filter sessions" aria-label="Filter sessions" autocomplete="off">
  <div class="toggles">
    <button id="byProject" aria-pressed="false">Group by project</button>
    <button id="archived" aria-pressed="false">Show archived</button>
  </div>
</header>
<main id="list"></main>
<script>
const $ = id => document.getElementById(id)
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e }
// Storage can throw in some contexts; the panel works without it
const store = {
  get: k => { try { return localStorage[k] } catch { return undefined } },
  set: (k, v) => { try { localStorage[k] = v } catch {} },
}
let data = []

const on = id => $(id).getAttribute('aria-pressed') === 'true'
for (const id of ['byProject', 'archived']) {
  $(id).setAttribute('aria-pressed', store.get(id) === '1')
  $(id).onclick = () => {
    const next = !on(id)
    $(id).setAttribute('aria-pressed', next)
    store.set(id, next ? '1' : '')
    render()
  }
}
$('q').oninput = render

// "/" jumps to the filter, arrows move between rows, Enter opens the focused row
document.onkeydown = e => {
  const rows = [...document.querySelectorAll('a.row')]
  const i = rows.indexOf(document.activeElement)
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); $('q').select() }
  else if (e.key === 'ArrowDown') { e.preventDefault(); rows[Math.min(i + 1, rows.length - 1)]?.focus() }
  else if (e.key === 'ArrowUp') { e.preventDefault(); i > 0 ? rows[i - 1].focus() : $('q').focus() }
  else if (e.key === 'Enter' && document.activeElement === $('q')) rows[0]?.click()
}

const ago = t => {
  const m = (Date.now() - t) / 60000
  return m < 1 ? 'now' : m < 60 ? `${m | 0}m` : m < 1440 ? `${m / 60 | 0}h` : `${m / 1440 | 0}d`
}
const dayBucket = t => {
  const days = Math.floor((new Date().setHours(24, 0, 0, 0) - t) / 864e5)
  return days < 1 ? 'Today' : days < 2 ? 'Yesterday' : days < 7 ? 'This week' : days < 30 ? 'This month' : 'Older'
}
// Each project keeps one of six colors, so the eye learns them; the theme picks each color's shade
const hue = name => `var(--h${[...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % 6})`
// Only recent asks float to the top; a month-old blocked session keeps its rail but stays in its day
const waiting = s => (s.status === 'blocked' || s.status === 'review_ready') && Date.now() - s.at < 7 * 864e5
const WAITING = 'Waiting on you'

function open(a, s) {
  fetch(`/open/${encodeURIComponent(s.id)}`, { method: 'POST' })
  store.set('here', s.id)
  for (const r of document.querySelectorAll('a.row.here')) r.classList.remove('here')
  a.classList.add('here', 'opening')
  setTimeout(() => a.classList.remove('opening'), 700)
}

function render() {
  const q = $('q').value.toLowerCase()
  const byProject = on('byProject')
  const rows = data.filter(s =>
    (on('archived') || !s.archived) &&
    (!q || `${s.title} ${s.project} ${s.branch || ''} ${s.detail || ''} ${s.action || ''}`.toLowerCase().includes(q)))

  // Spawned sessions and forks sit under their parent when the parent is shown, otherwise they stand alone
  const byId = new Map(data.map(s => [s.id, s]))
  const shown = new Set(rows.map(s => s.id))
  const kids = new Map()
  for (const s of rows) if (s.parent && shown.has(s.parent)) kids.set(s.parent, [...(kids.get(s.parent) || []), s])
  const latest = s => Math.max(s.at, ...(kids.get(s.id) || []).map(latest)) // a family sorts by its newest member
  const roots = rows.filter(s => !(s.parent && shown.has(s.parent))).sort((a, b) => latest(b) - latest(a))

  const groups = new Map(byProject ? [] : [[WAITING, []]])
  for (const s of roots) {
    const k = byProject ? s.project : waiting(s) ? WAITING : dayBucket(latest(s))
    groups.set(k, [...(groups.get(k) || []), s])
  }

  const here = store.get('here')
  const list = $('list')
  list.replaceChildren()
  const emit = (s, depth) => {
    const a = el('a', ['row', s.status, s.archived && 'archived', s.id === here && 'here'].filter(Boolean).join(' '))
    a.href = `claude://claude.ai/epitaxy/${encodeURIComponent(s.id)}`
    a.style.paddingLeft = `${10 + depth * 12}px`
    a.title = [s.title, s.cwd, s.branch, s.pr && `PR #${s.pr} ${(s.prState || '').toLowerCase()}`, `${s.turns} turns`].filter(Boolean).join('\n')
    a.onclick = e => { e.preventDefault(); open(a, s) }

    const title = el('div', 'title')
    if (depth) title.append(el('span', 'tree', '↳ '))
    title.append(s.title)
    const sub = el('div', 'sub')
    const parent = depth ? null : byId.get(s.parent)
    if (!byProject) {
      const p = el('span', 'proj', s.project)
      p.style.setProperty('--p', hue(s.project))
      sub.append(p)
    }
    const note = s.action || s.detail || (parent && `from ${parent.title}`) || (s.pr && `PR #${s.pr} ${(s.prState || '').toLowerCase()}`)
    if (note) sub.append(el('span', 'detail', note))
    a.append(title, el('div', 'when', ago(s.at)), sub)
    list.append(a)
    if (depth < 8) for (const k of (kids.get(s.id) || []).sort((a, b) => b.at - a.at)) emit(k, depth + 1)
  }
  for (const [name, items] of groups) {
    if (!items.length) continue
    const h = el('h2', name === WAITING ? 'waiting' : '', name)
    h.append(el('span', 'n', String(items.length)))
    list.append(h)
    for (const s of items) emit(s, 0)
  }
  if (!rows.length) list.append(el('p', 'empty', q ? `No sessions match "${$('q').value}".` : 'No sessions yet.'))
}

async function load() {
  try { data = await (await fetch('/data')).json() } catch { return } // server restarting, try again next tick
  render()
}
load()
setInterval(load, 15000)
</script>
